# Words that are not typos here. Every entry is a string that exists verbatim in
# the upstream data sources, so "correcting" it would break the adapter:
#   negociable  -> the endpoint name "negociable-obligations" (obligaciones negociables)
#   oficial     -> dolarapi's `casa` value for the official rate (dólar oficial)
# Adding a word here is a deliberate decision, not a way to silence the check.
[default.extend-words]
negociable = "negociable"
oficial = "oficial"
byma = "byma"
cedears = "cedears"
# ba -> the Buenos Aires exchange suffix in a Yahoo symbol (GGAL.BA, YPFD.BA). The
# check reads it as a misspelling of "by"/"be"; it is part of a real identifier.
ba = "ba"
# sur -> "TRANS. DE GAS DEL SUR", part of an issuer's name as the page prints it.
sur = "sur"
# ethe -> the ticker of the Grayscale Ethereum ETF as the page prints it, next to the
# Ethereum CEDEAR. The check reads it as a misspelling of "the".
ethe = "ethe"
# clase -> the unit class of a fund (Clase A, Clase B). Spanish, and the word the page
# uses; "Clase" would become "Clause", which names something else.
clase = "clase"

[files]
extend-exclude = [".venv", "graphify-out", "*.lock"]
