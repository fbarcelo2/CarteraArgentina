name: Security Scan

on:
  push:
    branches: [main, "feat/*", "fix/*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Deliberately not gitleaks-action: on a repository's first push it derives
      # a commit range from the event (`<root>^..HEAD`) and fails with "unknown
      # revision", because the root commit has no parent. Scanning the whole
      # history avoids the range arithmetic, and is what we want anyway.
      - name: Install gitleaks
        run: |
          version=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -oP '"tag_name":\s*"\K[^"]+')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${version}/gitleaks_${version#v}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan the full history for committed secrets
        run: gitleaks detect --source . --redact --exit-code 1

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # Audit the locked dependency set, not this project. This project is not
      # published on PyPI, and `pip-audit --strict` exits non-zero on any package
      # it cannot resolve — which turned a clean audit into a red build.
      - name: Export the locked dependencies (excluding this project)
        run: uv export --frozen --no-emit-project --no-hashes --output-file requirements-audit.txt
      - name: Audit dependencies (fails on high or critical)
        run: uvx pip-audit -r requirements-audit.txt --strict --desc on
