name: Tests & Lint

on:
  push:
    branches: [main, "feat/*", "fix/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen --extra mcp --extra web

      - name: Lint
        run: uv run ruff check . --output-format=github

      - name: Tests
        run: uv run pytest -q

      - name: Smoke check the capability manifest
        run: uv run cartera spec --json

  # The same script a contributor runs locally, so CI and the local loop cannot
  # drift: whatever is checked here is checked by `scripts/validate.sh`.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the secret scan walks the whole history

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen --extra mcp --extra web

      - name: Install the external validators
        run: scripts/install-validators.sh

      - name: Validation stack (static and dynamic)
        run: PATH="$HOME/.local/bin:$PATH" scripts/validate.sh
