[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartera-argentina"
version = "0.1.0"
description = "Read-only portfolio analytics for Argentine capital markets: market data ingest, lot-based accounting, deterministic metrics and AI-assisted proposals. No order execution."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CarteraArgentina contributors" }]
keywords = ["argentina", "byma", "portfolio", "analytics", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
keyring = ["keyring>=25.2"]
# A `web` extra (fastapi, uvicorn, jinja2, python-multipart) belongs here once the
# UI code exists. It was declared ahead of the code and removed: dependency
# hygiene tooling flagged it correctly, and a declared-but-unused dependency is
# an unverifiable surface that no test can exercise. Re-add it in the commit that
# adds the first web module.

[project.scripts]
cartera = "cartera.cli:main"
cartera-mcp = "cartera.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "respx>=0.21",
  "ruff>=0.6",
  "pip-audit>=2.7",
  "mcp>=1.2",
  # so the hydration path is installed and testable here too: a feature that
  # cannot be exercised in development is a feature that is not tested
  "keyring>=25.2",
  # static analysis: see scripts/validate.sh, which runs all of these
  "bandit>=1.7",
  "vulture>=2.11",
  "deptry>=0.20",
  "pyright>=1.1.380",
  "yamllint>=1.35",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cartera"]

[tool.deptry]
known_first_party = ["cartera"]

[tool.deptry.package_module_name_map]
# deptry matches import names against distribution names; these two differ.
python-dotenv = "dotenv"

# pytest configuration lives in pytest.ini (project standard), deliberately not
# duplicated here: two config sources for the same tool silently diverge.
