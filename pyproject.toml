[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartera-argentina"
version = "0.1.0"
description = "Read-only portfolio analytics for Argentine capital markets: market data ingest, lot-based accounting, deterministic metrics and AI-assisted proposals. No order execution."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CarteraArgentina contributors" }]
keywords = ["argentina", "byma", "portfolio", "analytics", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
keyring = ["keyring>=25.2"]

[project.scripts]
cartera = "cartera.cli:main"
cartera-mcp = "cartera.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "pip-audit>=2.7",
  "mcp>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cartera"]

# pytest configuration lives in pytest.ini (project standard), deliberately not
# duplicated here: two config sources for the same tool silently diverge.
