[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    --verbose
    --strict-markers
    --tb=short
    -ra
    --no-header
    -p no:cacheprovider

markers =
    unit: Unit tests (fast, isolated, no network)
    integration: Integration tests (SQLite file, HTTP mocks)
    security: Security tests (secrets, auth boundaries, no-network guarantees)
    slow: Slow tests (> 1s)
    smoke: Smoke tests (critical path: config, spec, metrics)
